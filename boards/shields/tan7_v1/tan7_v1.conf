# RGB LED Widgetの機能を有効化
CONFIG_RGBLED_WIDGET=y





# 40%以下で黄色、20%以下で赤色に設定（名称を修正しました）
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_HIGH=40
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_LOW=2

# LEDアンダーグロー機能を有効化
CONFIG_ZMK_RGB_UNDERGLOW=y

# ZMK/ZephyrのWS2812 SPIドライバで1ビットあたりのサイズを直接指定（利用可能な場合）
# 指定できない場合でも、下のRAMバッファ拡張で104個分の領域を強制確保します
CONFIG_SPI_NRFX_RAM_BUFFER_SIZE=4096

# キーボード起動時のLEDデフォルト状態
# 電池持ちを考慮し、USBを挿した時だけ明示的にオンにしたい場合はオフがおすすめです
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=y

# 1. ハードウェアとしての最大輝度を「60%」に制限する
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=20

# 2. 起動時の初期の明るさを、制限後の最大値（70%）に対して「30%」の明るさにする
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=5

# ロータリーエンコーダー（センサー機能）を有効化
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y
